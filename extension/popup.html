<!doctype html>
<html><head><meta charset="utf-8" />
<style>
  *{box-sizing:border-box;font-family:Inter,system-ui,-apple-system,sans-serif}
  body{width:320px;margin:0;padding:14px;background:#F1EFE8;color:#0f172a;font-size:13px}
  h1{font-size:14px;margin:0 0 10px;display:flex;align-items:center;gap:8px}
  .dot{width:22px;height:22px;border-radius:6px;background:#0F6E56;color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:12px}
  label{display:block;font-size:11px;color:#64748b;margin:8px 0 3px}
  input{width:100%;padding:7px 9px;border-radius:6px;border:1px solid transparent;background:#fff;font-size:13px}
  input:focus{outline:none;border-color:#0F6E56}
  .row{display:flex;gap:8px;margin-top:12px}
  button{flex:1;padding:8px;border-radius:6px;font-size:13px;font-weight:600;cursor:pointer;border:1px solid #d6d3cc;background:#fff}
  button.p{background:#0F6E56;border-color:#0F6E56;color:#fff}
  .msg{margin-top:10px;font-size:12px}.err{color:#be123c}
  .foot{margin-top:12px;padding-top:10px;border-top:1px solid #e4e1d8;display:flex;justify-content:space-between;align-items:center;font-size:12px;color:#64748b}
  a{color:#0F6E56;font-weight:600;cursor:pointer;text-decoration:none}
  .due{background:#fef3c7;color:#92400e;padding:6px 9px;border-radius:6px;margin-bottom:10px;font-size:12px}
</style></head>
<body>
  <h1><span class="dot">C</span> Concourse</h1>
  <div id="due" class="due" hidden></div>
  <label>Company</label><input id="company" />
  <label>Role</label><input id="role" />
  <div class="row"><button id="wish">Save to wishlist</button><button id="applied" class="p">I applied</button></div>
  <div id="msg" class="msg" hidden></div>
  <div class="foot"><a id="open">Open dashboard ↗</a><span id="srv"></span></div>
  <script src="popup.js"></script>
</body></html>
